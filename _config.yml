title: Jonah Elkhouri
email: jonahelkhouri@email.com
description: "UVA EE | Low-power IoT | Data Insight"
url: "https://jelkhouri.github.io"

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark"  # options: default, air, aqua, contrast, dark, dirt, neon, mint, sunrise

# Build settings
permalink: /:categories/:title/
paginate: 5
paginate_path: /blog/page:num/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

collections:
  projects:
    output: true
    permalink: /projects/:name/


author:
  name: "Jonah"
  bio: "EE student | Low-power IoT | Python & data analysis"
  location: "Virginia"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jelkhouri"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jonah-elkhouri/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true